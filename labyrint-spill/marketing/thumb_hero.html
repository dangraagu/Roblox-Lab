<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; }
  body {
    font-family: "Arial Black", Impact, system-ui, sans-serif;
    background:
      radial-gradient(120% 90% at 72% 42%, rgba(70,52,18,.55), rgba(0,0,0,0) 60%),
      radial-gradient(140% 120% at 30% 30%, #171b26 0%, #0b0d14 45%, #05060a 100%);
    position:relative;
  }
  /* faint maze grid texture */
  .grid { position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.03) 2px, transparent 2px),
      linear-gradient(90deg, rgba(255,255,255,.03) 2px, transparent 2px);
    background-size: 80px 80px, 80px 80px;
    mask: radial-gradient(90% 90% at 50% 50%, #000 40%, transparent 85%);
  }
  .vignette { position:absolute; inset:0;
    box-shadow: inset 0 0 340px 90px rgba(0,0,0,.9); pointer-events:none; }

  .wrap { position:absolute; inset:0; display:flex; align-items:center; }

  /* ---- left: text ---- */
  .left { width:56%; padding:0 60px 0 96px; }
  .kicker {
    font-family: "Segoe UI", Arial, sans-serif; font-weight:800;
    letter-spacing:.32em; font-size:34px; color:#8fd0ff;
    text-transform:uppercase; margin-bottom:18px; text-shadow:0 2px 10px rgba(0,0,0,.8);
  }
  .title {
    font-size:132px; line-height:.9; letter-spacing:-3px; text-transform:uppercase;
    background: linear-gradient(180deg,#fff2c4 0%,#f3c65a 34%,#c8892a 66%,#9c6417 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 6px 0 #3a260b) drop-shadow(0 14px 22px rgba(0,0,0,.7));
  }
  .title .l2 { font-size:104px; letter-spacing:1px; }
  .sub {
    font-family:"Segoe UI", Arial, sans-serif; font-weight:800;
    font-size:46px; color:#ffffff; margin-top:26px; text-shadow:0 3px 12px rgba(0,0,0,.8);
  }
  .sub b { color:#ffd24a; }
  .modes {
    font-family:"Segoe UI", Arial, sans-serif; font-weight:800; letter-spacing:.06em;
    font-size:34px; color:#cfd6e6; margin-top:20px;
  }
  .badge {
    position:absolute; top:92px; right:132px; transform:rotate(8deg);
    width:248px; height:248px; border-radius:50%;
    background: radial-gradient(circle at 40% 35%, #ff6a3d, #e11d1d 70%);
    border:10px solid #ffd24a; box-shadow:0 18px 40px rgba(0,0,0,.6), inset 0 0 40px rgba(0,0,0,.35);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    color:#fff; font-family:"Arial Black",Impact,sans-serif;
  }
  .badge .n { font-size:92px; line-height:.9; text-shadow:0 4px 0 rgba(0,0,0,.35); }
  .badge .t { font-size:36px; letter-spacing:.12em; margin-top:2px; }

  /* ---- right: maze art ---- */
  .right { position:absolute; right:70px; top:50%; transform:translateY(-50%); }
  svg { filter: drop-shadow(0 30px 50px rgba(0,0,0,.6)); }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="badge"><div class="n">500</div><div class="t">LEVELS</div></div>

  <div class="wrap">
    <div class="left">
      <div class="kicker">Maze Obby • Roblox</div>
      <div class="title">Labyrinth<br><span class="l2">Mariozo</span></div>
      <div class="sub">Every maze <b>unique</b> — and <b>harder every level</b>.</div>
      <div class="modes">SOLO&nbsp; · &nbsp;GROUP&nbsp; · &nbsp;PLAY WITH FRIENDS</div>
    </div>

    <div class="right">
      <svg width="720" height="720" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3b4a68"/>
            <stop offset="1" stop-color="#1c2740"/>
          </linearGradient>
          <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#121a2e"/>
            <stop offset="1" stop-color="#0a1020"/>
          </linearGradient>
          <filter id="glow"><feGaussianBlur stdDeviation="1.1" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <!-- board -->
        <rect x="4" y="4" width="92" height="92" rx="5" fill="url(#floor)" stroke="#2a3550" />
        <rect x="4" y="4" width="92" height="92" rx="5" fill="none" stroke="#33456a" stroke-width="1.5"/>
        <!-- maze walls -->
        <g fill="url(#wall)" stroke="#0b1220" stroke-width="0.5">
          <rect x="16" y="4"  width="4" height="34" rx="1.5"/>
          <rect x="16" y="50" width="4" height="46" rx="1.5"/>
          <rect x="30" y="16" width="4" height="52" rx="1.5"/>
          <rect x="30" y="80" width="34" height="4" rx="1.5"/>
          <rect x="44" y="4"  width="4" height="30" rx="1.5"/>
          <rect x="44" y="46" width="26" height="4" rx="1.5"/>
          <rect x="58" y="50" width="4" height="30" rx="1.5"/>
          <rect x="72" y="16" width="4" height="52" rx="1.5"/>
          <rect x="44" y="62" width="4" height="18" rx="1.5"/>
          <rect x="82" y="30" width="4" height="52" rx="1.5"/>
        </g>
        <!-- glowing solution path -->
        <polyline points="9,90 9,44 23,44 23,10 37,10 37,74 51,74 51,40 65,40 65,88 79,88 79,23 91,23 91,10"
          fill="none" stroke="#37e07a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
          filter="url(#glow)" opacity=".95"/>
        <!-- coins / gem -->
        <circle cx="23" cy="24" r="2.6" fill="#ffcf3a" stroke="#a9772a" stroke-width=".6"/>
        <circle cx="51" cy="56" r="2.6" fill="#ffcf3a" stroke="#a9772a" stroke-width=".6"/>
        <path d="M65 60 l3 4 -3 4 -3 -4 z" fill="#38d6ea" stroke="#0e7f8f" stroke-width=".5"/>
        <!-- lava trap -->
        <rect x="35" y="30" width="7" height="7" rx="1" fill="#ff4a2b" filter="url(#glow)"/>
        <rect x="53" y="20" width="7" height="7" rx="1" fill="#ff4a2b" filter="url(#glow)"/>
        <!-- start + finish -->
        <circle cx="9" cy="90" r="3.4" fill="#37e07a" filter="url(#glow)"/>
        <g transform="translate(91,10)">
          <rect x="-0.7" y="-6" width="1.4" height="12" fill="#e9edf5"/>
          <path d="M0.7 -6 h7 v5 h-7 z" fill="#ffd24a"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="vignette"></div>
</body>
</html>
