<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; }
  body {
    font-family:"Arial Black", Impact, system-ui, sans-serif;
    background:
      radial-gradient(120% 90% at 74% 46%, rgba(120,26,12,.55), rgba(0,0,0,0) 58%),
      radial-gradient(140% 120% at 30% 30%, #1a1620 0%, #120b0d 45%, #070405 100%);
    position:relative;
  }
  .grid { position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.03) 2px, transparent 2px),
      linear-gradient(90deg, rgba(255,255,255,.03) 2px, transparent 2px);
    background-size:80px 80px,80px 80px;
    mask: radial-gradient(90% 90% at 50% 50%, #000 40%, transparent 85%); }
  .vignette { position:absolute; inset:0; box-shadow: inset 0 0 340px 90px rgba(0,0,0,.9); }

  .brand { position:absolute; top:70px; left:96px;
    font-family:"Segoe UI",Arial,sans-serif; font-weight:900; letter-spacing:.06em;
    font-size:38px;
    background:linear-gradient(180deg,#fff2c4,#f3c65a 45%,#c8892a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.7)); }

  .wrap { position:absolute; inset:0; display:flex; align-items:center; }
  .left { width:56%; padding:0 40px 0 96px; }
  .kicker { font-family:"Segoe UI",Arial,sans-serif; font-weight:800; letter-spacing:.3em;
    font-size:34px; color:#ff7a5c; text-transform:uppercase; margin-bottom:14px;
    text-shadow:0 2px 10px rgba(0,0,0,.8); }
  .title { font-size:118px; line-height:.92; letter-spacing:-2px; text-transform:uppercase;
    color:#ffffff; filter:drop-shadow(0 6px 0 #2a0a06) drop-shadow(0 14px 22px rgba(0,0,0,.7)); }
  .title .hot {
    background:linear-gradient(180deg,#ffd24a,#ff7a2e 55%,#e11d1d);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { font-family:"Segoe UI",Arial,sans-serif; font-weight:800; font-size:44px; color:#fff;
    margin-top:28px; text-shadow:0 3px 12px rgba(0,0,0,.8); }
  .sub b { color:#ff6a4a; }
  .tag { font-family:"Segoe UI",Arial,sans-serif; font-weight:900; letter-spacing:.08em;
    font-size:36px; color:#ffd24a; margin-top:20px; }

  .right { position:absolute; right:70px; top:50%; transform:translateY(-50%);
    filter:drop-shadow(0 30px 50px rgba(0,0,0,.6)); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="brand">LABYRINTH MARIOZO</div>

  <div class="wrap">
    <div class="left">
      <div class="kicker">Watch your step</div>
      <div class="title">Dodge the<br><span class="hot">Traps</span><br>&amp; Monsters</div>
      <div class="sub">Lava, spikes and <b>chasers</b> — one wrong move and you restart.</div>
      <div class="tag">500 LEVELS OF DANGER</div>
    </div>

    <div class="right">
      <svg width="700" height="700" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#22161c"/><stop offset="1" stop-color="#120a10"/>
          </linearGradient>
          <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5a3742"/><stop offset="1" stop-color="#31202a"/>
          </linearGradient>
          <radialGradient id="lava" cx="50%" cy="40%" r="70%">
            <stop offset="0" stop-color="#ffd24a"/><stop offset="45%" stop-color="#ff6a2e"/>
            <stop offset="100%" stop-color="#c21212"/>
          </radialGradient>
          <filter id="glow"><feGaussianBlur stdDeviation="1.2" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <rect x="4" y="4" width="92" height="92" rx="5" fill="url(#floor)" stroke="#3a2530" stroke-width="1.5"/>
        <g fill="url(#wall)" stroke="#160c12" stroke-width="0.5">
          <rect x="20" y="8"  width="4" height="40" rx="1.5"/>
          <rect x="20" y="60" width="4" height="34" rx="1.5"/>
          <rect x="36" y="20" width="4" height="52" rx="1.5"/>
          <rect x="52" y="8"  width="4" height="34" rx="1.5"/>
          <rect x="52" y="56" width="4" height="38" rx="1.5"/>
          <rect x="68" y="20" width="4" height="52" rx="1.5"/>
          <rect x="80" y="8"  width="4" height="40" rx="1.5"/>
        </g>
        <!-- lava plates -->
        <g filter="url(#glow)">
          <rect x="27" y="30" width="8" height="8" rx="1.5" fill="url(#lava)"/>
          <rect x="43" y="62" width="8" height="8" rx="1.5" fill="url(#lava)"/>
          <rect x="59" y="24" width="8" height="8" rx="1.5" fill="url(#lava)"/>
          <rect x="59" y="70" width="8" height="8" rx="1.5" fill="url(#lava)"/>
          <rect x="75" y="52" width="8" height="8" rx="1.5" fill="url(#lava)"/>
        </g>
        <!-- runner (green) -->
        <circle cx="14" cy="80" r="4" fill="#37e07a" filter="url(#glow)"/>
        <!-- monster chaser -->
        <g transform="translate(46,42)">
          <circle r="7.5" fill="#7b2ff2" filter="url(#glow)"/>
          <circle cx="-2.6" cy="-1.4" r="1.7" fill="#fff"/><circle cx="2.6" cy="-1.4" r="1.7" fill="#fff"/>
          <circle cx="-2.6" cy="-1.4" r=".8" fill="#111"/><circle cx="2.6" cy="-1.4" r=".8" fill="#111"/>
          <path d="M-3.5 3 q3.5 3 7 0" stroke="#2a0a4a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
  </div>
  <div class="vignette"></div>
</body>
</html>
